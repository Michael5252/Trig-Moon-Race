<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trig Mission</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><h1>🚀 Trig Mission: Race to the Moon</h1><p>Master trig identities, beat the clock, and climb the class leaderboard.</p></header><section id="startScreen" class="card"><h2>Start Mission</h2><label>Your name</label><input id="playerName" maxlength="30" placeholder="Enter your name"><button id="startBtn">Launch 🚀</button></section><section id="gameScreen" class="hidden"><div class="space"><span class="earth">🌎</span><span class="moon">🌕</span><div class="path"></div><div id="rocket" class="rocket">🚀</div><div class="spaceLabel"><span id="progressText">0%</span> to Moon</div></div><div class="stats"><span>👤 <b id="nameDisplay"></b></span><span>⏱️ <b id="timer">00:00.0</b></span><span>❤️ <b id="lives">5</b></span><span>🔥 <b id="streak">0</b></span><span>⚡ <b id="xp">0</b> XP</span></div><section class="card"><div class="meta"><span id="zone"></span><span>Question <b id="qnum">1</b>/30</span></div><div id="prompt" class="prompt"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div><button id="nextBtn" class="hidden">Next Challenge →</button></section></section><section id="finishScreen" class="card hidden"><div class="big">🌕🚀</div><h2 id="finishTitle"></h2><p id="finishSummary"></p><button id="againBtn">Play Again</button></section><section class="card"><div class="leaderHead"><h2>🏆 Class Leaderboard</h2><button id="refreshBtn" class="secondary">Refresh</button></div><p class="small">Ranked by correct answers, then fastest time.</p><div class="tableWrap"><table><thead><tr><th>#</th><th>Name</th><th>Correct</th><th>Time</th><th>XP</th></tr></thead><tbody id="leaderboard"><tr><td colspan="5">Loading…</td></tr></tbody></table></div><p id="dbStatus" class="small"></p></section></main><script type="module" src="app.js"></script></body></html>
